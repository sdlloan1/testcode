services:
  - type: web
    name: testcode
    env:
      SUPABASE_URL: $SUPABASE_URL
      SUPABASE_KEY: $SUPABASE_KEY
      SUPABASE_SECRET: $SUPABASE_SECRET
    build:
      command: npm install && npm run build
      docker:
        context: .
        dockerfile: Dockerfile
    envVars:
      - key: SUPABASE_URL
        value: ${SUPABASE_URL}
      - key: SUPABASE_KEY
        value: ${SUPABASE_KEY}
      - key: SUPABASE_SECRET
        value: ${SUPABASE_SECRET}
    routes:
      - path: /
